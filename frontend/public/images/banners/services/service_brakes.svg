<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#09090b" />
      <stop offset="50%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#09090b" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#27272a" stroke-width="0.75" opacity="0.6" />
    </pattern>

    <!-- Rotor Steel Metallic Gradients -->
    <linearGradient id="steelRotor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#a1a1aa" />
      <stop offset="25%" stopColor="#f4f4f5" />
      <stop offset="50%" stopColor="#71717a" />
      <stop offset="75%" stopColor="#e4e4e7" />
      <stop offset="100%" stopColor="#52525b" />
    </linearGradient>

    <radialGradient id="innerCarrier" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#27272a" />
      <stop offset="70%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#09090b" />
    </radialGradient>

    <!-- Gold Titanium Floating Pins & Accents -->
    <linearGradient id="goldTitanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fde047" />
      <stop offset="40%" stopColor="#eab308" />
      <stop offset="100%" stopColor="#ca8a04" />
    </linearGradient>

    <!-- Caliper Red / Gold Racing Finish -->
    <linearGradient id="caliperFinish" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stopColor="#ef4444" />
      <stop offset="45%" stopColor="#dc2626" />
      <stop offset="85%" stopColor="#991b1b" />
      <stop offset="100%" stopColor="#7f1d1d" />
    </linearGradient>

    <!-- Braided Steel Hose -->
    <linearGradient id="braidedHose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#71717a" />
      <stop offset="50%" stopColor="#e4e4e7" />
      <stop offset="100%" stopColor="#3f3f46" />
    </linearGradient>

    <!-- Copper Pad Backing -->
    <linearGradient id="copperPad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fb923c" />
      <stop offset="50%" stopColor="#ea580c" />
      <stop offset="100%" stopColor="#c2410c" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Studio Ambient Floor Horizon Glow -->
  <ellipse cx="400" cy="225" rx="350" ry="180" fill="#22c55e" opacity="0.06" filter="blur(60px)" />
  <line x1="0" y1="449" x2="800" y2="449" stroke="#3f3f46" stroke-width="1" />

  <!-- TECHNICAL BLUEPRINT CALLOUTS & RULERS -->
  <g opacity="0.4" stroke="#71717a" stroke-width="0.8">
    <line x1="120" y1="50" x2="120" y2="400" stroke-dasharray="4 4" />
    <line x1="680" y1="50" x2="680" y2="400" stroke-dasharray="4 4" />
    <circle cx="280" cy="225" r="185" fill="none" stroke-dasharray="2 4" />
    <text x="30" y="40" fill="#a1a1aa" font-family="monospace" font-size="11" letter-spacing="1">MOTORCYCLE DUAL-PISTON HYDRAULIC BRAKE SYSTEM SPEC // 260mm FLOATING DISC</text>
  </g>

  <!-- ============================================== -->
  <!-- 1. MOTORCYCLE FLOATING BRAKE ROTOR (260MM SPEC) -->
  <!-- ============================================== -->
  <g id="rotorAssembly" transform="translate(0, 0)">
    <!-- Outer Wavy Friction Rotor Ring -->
    <path d="M 280 55 
             C 320 55, 360 70, 395 95 
             C 425 125, 445 165, 450 205
             C 455 245, 440 290, 410 325 
             C 375 365, 325 390, 280 395
             C 235 390, 185 365, 150 325
             C 120 290, 105 245, 110 205
             C 115 165, 135 125, 165 95
             C 200 70, 240 55, 280 55 Z" 
          fill="url(#steelRotor)" stroke="#3f3f46" stroke-width="2" />

    <!-- Inner Friction Ring Cutout -->
    <circle cx="280" cy="225" r="115" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />

    <!-- Lightweight Inner Aluminum Carrier (Black Anodized) -->
    <circle cx="280" cy="225" r="95" fill="url(#innerCarrier)" stroke="#52525b" stroke-width="1.5" />

    <!-- Carrier Center Axle Hub Hole & 5-Bolt Hub Pattern -->
    <circle cx="280" cy="225" r="42" fill="#09090b" stroke="#71717a" stroke-width="1.5" />
    <!-- 5 Hub Mounting Bolt Holes -->
    <g fill="#d4d4d8" stroke="#18181b" stroke-width="1.2">
      <circle cx="280" cy="165" r="6" />
      <circle cx="337" cy="206" r="6" />
      <circle cx="315" cy="274" r="6" />
      <circle cx="245" cy="274" r="6" />
      <circle cx="223" cy="206" r="6" />
    </g>

    <!-- Slotted Heat Dissipation Vents on Carrier Spokes -->
    <path d="M 270 120 L 290 120 L 285 150 L 275 150 Z" fill="#09090b" opacity="0.8" />
    <path d="M 360 185 L 375 198 L 350 215 L 340 205 Z" fill="#09090b" opacity="0.8" />
    <path d="M 330 290 L 335 310 L 310 305 L 305 285 Z" fill="#09090b" opacity="0.8" />
    <path d="M 230 290 L 225 310 L 250 305 L 255 285 Z" fill="#09090b" opacity="0.8" />
    <path d="M 200 185 L 185 198 L 210 215 L 220 205 Z" fill="#09090b" opacity="0.8" />

    <!-- Floating Bobbins / Rivets (Gold Anodized Titanium) -->
    <g fill="url(#goldTitanium)" stroke="#713f12" stroke-width="1">
      <circle cx="280" cy="115" r="8" />
      <circle cx="280" cy="115" r="4" fill="#1c1917" />

      <circle cx="375" cy="160" r="8" />
      <circle cx="375" cy="160" r="4" fill="#1c1917" />

      <circle cx="375" cy="290" r="8" />
      <circle cx="375" cy="290" r="4" fill="#1c1917" />

      <circle cx="280" cy="335" r="8" />
      <circle cx="280" cy="335" r="4" fill="#1c1917" />

      <circle cx="185" cy="290" r="8" />
      <circle cx="185" cy="290" r="4" fill="#1c1917" />

      <circle cx="185" cy="160" r="8" />
      <circle cx="185" cy="160" r="4" fill="#1c1917" />
    </g>

    <!-- Cross-Drilled Rotor Ventilation Holes (Double Spiral Array) -->
    <g fill="#09090b">
      <!-- Outer Ring Holes -->
      <circle cx="280" cy="72" r="3" />
      <circle cx="310" cy="75" r="3" />
      <circle cx="340" cy="85" r="3" />
      <circle cx="370" cy="102" r="3" />
      <circle cx="398" cy="125" r="3" />
      <circle cx="420" cy="155" r="3" />
      <circle cx="432" cy="188" r="3" />
      <circle cx="434" cy="225" r="3" />
      <circle cx="428" cy="260" r="3" />
      <circle cx="410" cy="295" r="3" />
      <circle cx="385" cy="325" r="3" />
      <circle cx="355" cy="350" r="3" />
      <circle cx="320" cy="368" r="3" />
      <circle cx="280" cy="378" r="3" />
      <circle cx="240" cy="368" r="3" />
      <circle cx="205" cy="350" r="3" />
      <circle cx="175" cy="325" r="3" />
      <circle cx="150" cy="295" r="3" />
      <circle cx="132" cy="260" r="3" />
      <circle cx="126" cy="225" r="3" />
      <circle cx="128" cy="188" r="3" />
      <circle cx="140" cy="155" r="3" />
      <circle cx="162" cy="125" r="3" />
      <circle cx="190" cy="102" r="3" />
      <circle cx="220" cy="85" r="3" />
      <circle cx="250" cy="75" r="3" />

      <!-- Inner Track Slotted Vents -->
      <rect x="278" y="88" width="4" height="12" rx="2" transform="rotate(0 280 94)" />
      <rect x="338" y="105" width="4" height="12" rx="2" transform="rotate(30 340 111)" />
      <rect x="388" y="145" width="4" height="12" rx="2" transform="rotate(60 390 151)" />
      <rect x="408" y="200" width="4" height="12" rx="2" transform="rotate(90 410 206)" />
      <rect x="398" y="260" width="4" height="12" rx="2" transform="rotate(120 400 266)" />
      <rect x="358" y="310" width="4" height="12" rx="2" transform="rotate(150 360 316)" />
      <rect x="278" y="340" width="4" height="12" rx="2" transform="rotate(180 280 346)" />
      <rect x="198" y="310" width="4" height="12" rx="2" transform="rotate(210 200 316)" />
      <rect x="158" y="260" width="4" height="12" rx="2" transform="rotate(240 160 266)" />
      <rect x="148" y="200" width="4" height="12" rx="2" transform="rotate(270 150 206)" />
      <rect x="168" y="145" width="4" height="12" rx="2" transform="rotate(300 170 151)" />
      <rect x="218" y="105" width="4" height="12" rx="2" transform="rotate(330 220 111)" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 2. HIGH-PERFORMANCE RACING BRAKE CALIPER (RCB / BREMBO) -->
  <!-- ======================================================== -->
  <g id="caliperAssembly" transform="translate(180, -20)">
    <!-- Radial Caliper Body with CNC Beveled Bridges -->
    <path d="M 260 90 
             L 370 70 
             C 410 65, 430 85, 435 125 
             L 440 210 
             C 440 245, 420 265, 385 270 
             L 280 285 
             C 255 288, 235 275, 230 250 
             L 220 130 
             C 218 105, 235 93, 260 90 Z" 
          fill="url(#caliperFinish)" stroke="#450a0a" stroke-width="2" />

    <!-- Caliper Weight-Reduction Recess & Logo Plate -->
    <path d="M 270 110 L 360 95 C 385 90, 395 105, 398 125 L 400 185 C 400 205, 385 215, 365 220 L 280 230 C 265 232, 255 225, 252 210 L 248 135 C 246 120, 255 112, 270 110 Z" 
          fill="#18181b" stroke="#7f1d1d" stroke-width="1.5" />

    <!-- Dual Hydraulic Pistons (Front & Rear Pistons) -->
    <g stroke="#52525b" stroke-width="1.5">
      <!-- Piston 1 -->
      <circle cx="295" cy="165" r="22" fill="#27272a" />
      <circle cx="295" cy="165" r="17" fill="url(#steelRotor)" />
      <circle cx="295" cy="165" r="6" fill="#18181b" />

      <!-- Piston 2 -->
      <circle cx="355" cy="155" r="22" fill="#27272a" />
      <circle cx="355" cy="155" r="17" fill="url(#steelRotor)" />
      <circle cx="355" cy="155" r="6" fill="#18181b" />
    </g>

    <!-- Caliper Pad Retention Stainless Pin -->
    <rect x="250" y="245" width="135" height="5" rx="2.5" fill="#e4e4e7" stroke="#3f3f46" stroke-width="0.8" />
    <circle cx="254" cy="247.5" r="3" fill="#facc15" />

    <!-- Hydraulic Bleeder Valve Nipple with Rubber Cap -->
    <path d="M 395 65 L 405 45 L 413 45 L 413 65 Z" fill="#d4d4d8" stroke="#18181b" stroke-width="1" />
    <rect x="403" y="38" width="12" height="10" rx="3" fill="#18181b" />

    <!-- Stainless Steel Banjo Bolt & Braided Brake Line Fitting -->
    <g transform="translate(340, 50)">
      <!-- Copper Washers (Twin) -->
      <rect x="0" y="8" width="22" height="3" fill="#ea580c" rx="1" />
      <rect x="0" y="21" width="22" height="3" fill="#ea580c" rx="1" />
      <!-- Hex Banjo Bolt -->
      <path d="M 4 2 L 18 2 L 22 8 L 22 24 L 18 30 L 4 30 L 0 24 L 0 8 Z" fill="url(#steelRotor)" stroke="#18181b" stroke-width="1" />
      <circle cx="11" cy="16" r="4" fill="#09090b" />
      <!-- Banjo Eye Fitting -->
      <circle cx="11" cy="16" r="14" fill="none" stroke="url(#steelRotor)" stroke-width="6" />
      <!-- Braided Stainless Hose Outlet Arcing Away -->
      <path d="M 25 16 C 50 16, 75 5, 100 -10 C 130 -30, 160 -40, 200 -50" fill="none" stroke="url(#braidedHose)" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- Twin Radial Mount Bosses & Torx Flange Mounting Bolts -->
    <g fill="#d4d4d8" stroke="#18181b" stroke-width="1.2">
      <!-- Lower Boss Bolt -->
      <circle cx="240" cy="295" r="10" fill="#27272a" />
      <circle cx="240" cy="295" r="6" fill="url(#goldTitanium)" />
      <!-- Upper Boss Bolt -->
      <circle cx="225" cy="80" r="10" fill="#27272a" />
      <circle cx="225" cy="80" r="6" fill="url(#goldTitanium)" />
    </g>

    <!-- Caliper Brand Text -->
    <text x="325" y="125" fill="#f43f5e" font-family="sans-serif" font-weight="900" font-size="12" letter-spacing="2" text-anchor="middle">RACING</text>
  </g>

  <!-- ======================================================== -->
  <!-- 3. SINTERED CERAMIC MOTORCYCLE BRAKE PADS (COPPER BACKING)-->
  <!-- ======================================================== -->
  <g id="brakePads" transform="translate(560, 240)">
    <!-- Pad 1: Copper Backing Plate -->
    <path d="M 10 30 L 110 30 C 125 30, 135 40, 130 65 L 120 110 C 118 120, 110 125, 95 125 L 25 125 C 10 125, 5 118, 5 105 L 0 50 C 0 35, 2 30, 10 30 Z" 
          fill="url(#copperPad)" stroke="#7c2d12" stroke-width="1.5" />
    <!-- Retention Mounting Eyelets -->
    <circle cx="25" cy="42" r="6" fill="#09090b" stroke="#ea580c" stroke-width="1" />
    <circle cx="95" cy="42" r="6" fill="#09090b" stroke="#ea580c" stroke-width="1" />
    <!-- Sintered Friction Compound Puck (Beveled Chamfers) -->
    <rect x="15" y="60" width="95" height="55" rx="5" fill="#27272a" stroke="#52525b" stroke-width="1.2" />
    <!-- Wear Indicator Groove -->
    <line x1="62" y1="60" x2="62" y2="115" stroke="#09090b" stroke-width="3" />
    <line x1="15" y1="88" x2="110" y2="88" stroke="#18181b" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Technical Spec Label -->
    <text x="62" y="145" fill="#a1a1aa" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CERAMIC SINTERED PAD</text>
  </g>

  <!-- Spec Badges in Corners -->
  <g transform="translate(30, 415)">
    <rect x="0" y="0" width="135" height="20" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
    <text x="67" y="14" fill="#4ade80" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">DOT 4.0 / 5.1 COMPLIANT</text>
  </g>

  <g transform="translate(640, 415)">
    <rect x="0" y="0" width="130" height="20" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
    <text x="65" y="14" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">PRECISION CNC ALLOY</text>
  </g>
</svg>
