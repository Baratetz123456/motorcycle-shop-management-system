<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background -->
    <linearGradient id="tireBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#09090b" />
      <stop offset="50%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#09090b" />
    </linearGradient>

    <!-- Technical Grid -->
    <pattern id="tireGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#27272a" stroke-width="0.75" opacity="0.6" />
    </pattern>

    <!-- Deep Rubber Tread Black -->
    <radialGradient id="rubberTread" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#27272a" />
      <stop offset="60%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#09090b" />
    </radialGradient>

    <!-- Cast Alloy Wheel Rim (Gold Titanium Finish) -->
    <linearGradient id="rimGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fde047" />
      <stop offset="40%" stopColor="#eab308" />
      <stop offset="80%" stopColor="#ca8a04" />
      <stop offset="100%" stopColor="#854d0e" />
    </linearGradient>

    <!-- Digital Gauge Blue LCD -->
    <linearGradient id="lcdBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#082f49" />
      <stop offset="100%" stopColor="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#tireBg)" />
  <rect width="800" height="450" fill="url(#tireGrid)" />

  <!-- Ambient Floor Horizon Glow -->
  <ellipse cx="400" cy="225" rx="350" ry="180" fill="#38bdf8" opacity="0.06" filter="blur(60px)" />
  <line x1="0" y1="449" x2="800" y2="449" stroke="#3f3f46" stroke-width="1" />

  <!-- Technical Spec Callout -->
  <g opacity="0.4" stroke="#71717a" stroke-width="0.8">
    <line x1="120" y1="40" x2="120" y2="410" stroke-dasharray="4 4" />
    <line x1="680" y1="40" x2="680" y2="410" stroke-dasharray="4 4" />
    <text x="30" y="38" fill="#a1a1aa" font-family="monospace" font-size="11" letter-spacing="1">MOTORCYCLE TIRE INSPECTION // PRESSURE PSI CHECK &amp; TREAD DEPTH VERIFICATION</text>
  </g>

  <!-- ======================================================== -->
  <!-- 1. MOTORCYCLE WHEEL RIM & SPORT TIRE WITH TREAD CHANNELS -->
  <!-- ======================================================== -->
  <g id="motorcycleWheel" transform="translate(240, 225)">
    <!-- Outer Motorcycle Rubber Tire Cross-Section Silhouette -->
    <circle cx="0" cy="0" r="175" fill="url(#rubberTread)" stroke="#27272a" stroke-width="4" />
    <circle cx="0" cy="0" r="145" fill="#18181b" stroke="#3f3f46" stroke-width="2" />

    <!-- Directional Sport Radial Tread Grooves (V-Sipes) -->
    <g stroke="#09090b" stroke-width="4" stroke-linecap="round">
      <path d="M 0 -170 L 15 -152 L 35 -148" />
      <path d="M 0 -170 L -15 -152 L -35 -148" />
      <path d="M 85 -145 L 95 -125 L 115 -118" />
      <path d="M 145 -85 L 140 -65 L 150 -45" />
      <path d="M 170 0 L 152 15 L 148 35" />
      <path d="M 145 85 L 125 95 L 118 115" />
      <path d="M 85 145 L 65 140 L 45 150" />
      <path d="M 0 170 L 15 152 L 35 148" />
      <path d="M 0 170 L -15 152 L -35 148" />
      <path d="M -85 145 L -95 125 L -115 118" />
      <path d="M -145 85 L -140 65 L -150 45" />
      <path d="M -170 0 L -152 -15 L -148 -35" />
      <path d="M -145 -85 L -125 -95 L -118 -115" />
      <path d="M -85 -145 L -65 -140 L -45 -150" />
    </g>

    <!-- Cast Alloy Gold Rim Lip -->
    <circle cx="0" cy="0" r="115" fill="url(#rimGold)" stroke="#78350f" stroke-width="2" />
    <circle cx="0" cy="0" r="102" fill="#18181b" stroke="#3f3f46" stroke-width="2" />

    <!-- 5 Split-Spoke Sport Motorcycle Alloy Rim Spokes -->
    <g stroke="url(#rimGold)" stroke-width="12" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-96" />
      <line x1="0" y1="0" x2="91" y2="-30" />
      <line x1="0" y1="0" x2="56" y2="78" />
      <line x1="0" y1="0" x2="-56" y2="78" />
      <line x1="0" y1="0" x2="-91" y2="-30" />
    </g>

    <!-- Center Hub & Axle Bearing -->
    <circle cx="0" cy="0" r="32" fill="#27272a" stroke="#52525b" stroke-width="2" />
    <circle cx="0" cy="0" r="16" fill="#09090b" stroke="#a1a1aa" stroke-width="1.5" />
    <circle cx="0" cy="0" r="6" fill="#f4f4f5" />

    <!-- 90-Degree CNC Anodized Tire Valve Stem -->
    <g transform="translate(68, -80)">
      <path d="M 0 0 L 14 -12 L 28 -12" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
      <!-- Chrome Valve Cap -->
      <rect x="26" y="-16" width="10" height="8" rx="2" fill="#e4e4e7" stroke="#18181b" stroke-width="0.8" />
    </g>

    <!-- Tire Specification Stamp on Sidewall -->
    <text x="0" y="-124" fill="#52525b" font-family="monospace" font-size="8" font-weight="bold" letter-spacing="1" text-anchor="middle">120/70-17 M/C 58W TUBELESS</text>
  </g>

  <!-- ======================================================== -->
  <!-- 2. DIGITAL TIRE PRESSURE GAUGE CLAMPED & MEASURING       -->
  <!-- ======================================================== -->
  <g id="pressureGauge" transform="translate(480, 80)">
    <!-- Gauge Rubber Shockproof Body (Black & Blue) -->
    <rect x="0" y="20" width="160" height="90" rx="14" fill="#18181b" stroke="#0284c7" stroke-width="2" />

    <!-- Digital Backlit LCD Screen -->
    <rect x="15" y="32" width="130" height="48" rx="6" fill="url(#lcdBlue)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Pressure Display readout -->
    <text x="75" y="66" fill="#ffffff" font-family="monospace" font-size="28" font-weight="900" text-anchor="middle">32.5</text>
    <text x="135" y="52" fill="#7dd3fc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">PSI</text>
    <text x="135" y="68" fill="#4ade80" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="end">READY</text>

    <!-- Braided Chuck Hose Connecting to Valve -->
    <path d="M 0 65 C -40 65, -100 80, -145 60" fill="none" stroke="#52525b" stroke-width="6" stroke-linecap="round" />
    <!-- Brass Quick-Release Chuck Head -->
    <g transform="translate(-145, 55)">
      <rect x="-16" y="0" width="18" height="12" rx="2" fill="#ca8a04" stroke="#713f12" stroke-width="1" />
      <line x1="-7" y1="-2" x2="-7" y2="14" stroke="#eab308" stroke-width="2" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 3. VERNIER TREAD DEPTH GAUGE (COLOR-CODED WEAR MEASURE)  -->
  <!-- ======================================================== -->
  <g id="treadDepthGauge" transform="translate(540, 240)">
    <!-- Gauge Ruler Body -->
    <rect x="0" y="0" width="22" height="120" rx="3" fill="#d4d4d8" stroke="#18181b" stroke-width="1.2" />
    <!-- Vernier Millimeter Graduations -->
    <g stroke="#18181b" stroke-width="0.8">
      <line x1="0" y1="20" x2="8" y2="20" />
      <line x1="0" y1="30" x2="6" y2="30" />
      <line x1="0" y1="40" x2="8" y2="40" />
      <line x1="0" y1="50" x2="6" y2="50" />
      <line x1="0" y1="60" x2="12" y2="60" />
      <line x1="0" y1="70" x2="6" y2="70" />
      <line x1="0" y1="80" x2="8" y2="80" />
      <line x1="0" y1="90" x2="6" y2="90" />
    </g>

    <!-- Color Coded Wear Indicator (Green / Yellow / Red) -->
    <rect x="14" y="20" width="6" height="30" fill="#22c55e" />
    <rect x="14" y="50" width="6" height="25" fill="#eab308" />
    <rect x="14" y="75" width="6" height="25" fill="#ef4444" />

    <!-- Sliding Probe Collar Bar -->
    <rect x="-18" y="55" width="58" height="12" rx="2" fill="#18181b" stroke="#52525b" stroke-width="1" />
    <text x="45" y="65" fill="#4ade80" font-family="monospace" font-size="10" font-weight="bold">5.2 mm (GOOD)</text>

    <!-- Steel Probe Needle Extending Down into Tread -->
    <line x1="11" y1="120" x2="11" y2="150" stroke="#71717a" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Spec Badges in Corners -->
  <g transform="translate(30, 415)">
    <rect x="0" y="0" width="145" height="20" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
    <text x="72" y="14" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">COLD TIRE PRESSURE 32 PSI</text>
  </g>

  <g transform="translate(630, 415)">
    <rect x="0" y="0" width="140" height="20" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
    <text x="70" y="14" fill="#4ade80" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">5.2mm SAFE TREAD DEPTH</text>
  </g>
</svg>
