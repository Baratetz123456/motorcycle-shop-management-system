<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background -->
    <linearGradient id="filterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#09090b" />
      <stop offset="50%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#09090b" />
    </linearGradient>

    <!-- Technical Grid -->
    <pattern id="filterGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#27272a" stroke-width="0.75" opacity="0.6" />
    </pattern>

    <!-- High-Flow Filter Cotton Pleats (Red Racing Filter) -->
    <linearGradient id="pleatRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ef4444" />
      <stop offset="50%" stopColor="#b91c1c" />
      <stop offset="100%" stopColor="#ef4444" />
    </linearGradient>

    <!-- Heavy-Duty Urethane Filter Frame (Red/Black) -->
    <linearGradient id="rubberFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#dc2626" />
      <stop offset="50%" stopColor="#991b1b" />
      <stop offset="100%" stopColor="#7f1d1d" />
    </linearGradient>

    <!-- Motorcycle Airbox Textured Plastic -->
    <linearGradient id="airboxBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#27272a" />
      <stop offset="50%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#09090b" />
    </linearGradient>

    <!-- Metal Mesh Texture -->
    <linearGradient id="steelMesh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#71717a" />
      <stop offset="50%" stopColor="#e4e4e7" />
      <stop offset="100%" stopColor="#52525b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#filterBg)" />
  <rect width="800" height="450" fill="url(#filterGrid)" />

  <!-- Ambient Green Workshop Clean Air Glow -->
  <ellipse cx="400" cy="225" rx="350" ry="180" fill="#10b981" opacity="0.07" filter="blur(60px)" />
  <line x1="0" y1="449" x2="800" y2="449" stroke="#3f3f46" stroke-width="1" />

  <!-- Technical Spec Callout -->
  <g opacity="0.4" stroke="#71717a" stroke-width="0.8">
    <line x1="120" y1="40" x2="120" y2="410" stroke-dasharray="4 4" />
    <line x1="680" y1="40" x2="680" y2="410" stroke-dasharray="4 4" />
    <text x="30" y="38" fill="#a1a1aa" font-family="monospace" font-size="11" letter-spacing="1">MOTORCYCLE INTAKE AIR FILTER &amp; OIL FILTER ELEMENT REPLACEMENT // HIGH-FLOW SPEC</text>
  </g>

  <!-- ======================================================== -->
  <!-- 1. MOTORCYCLE OPEN AIRBOX HOUSING (SCOOTER / UNDERBONE)  -->
  <!-- ======================================================== -->
  <g id="openAirbox" transform="translate(80, 80)">
    <!-- Airbox Outer Housing Recess -->
    <path d="M 50 30 
             L 340 30 
             C 380 30, 410 60, 410 110 
             L 410 240 
             C 410 275, 380 295, 340 295 
             L 60 295 
             C 30 295, 10 270, 10 230 
             L 10 75 
             C 10 45, 30 30, 50 30 Z" 
          fill="url(#airboxBlack)" stroke="#3f3f46" stroke-width="2" />

    <!-- Airbox Air Intake Snorkel Tube -->
    <path d="M 10 120 L -40 120 C -60 120, -70 140, -70 160 C -70 180, -60 190, -40 190 L 10 190 Z" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <!-- Airbox Throttle Body Intake Velocity Stack (Center outlet) -->
    <circle cx="330" cy="160" r="45" fill="#09090b" stroke="#71717a" stroke-width="2" />
    <circle cx="330" cy="160" r="32" fill="#18181b" stroke="#52525b" stroke-width="1.2" />

    <!-- 6 Airbox Cover Mounting Screw Stanchions -->
    <g fill="#09090b" stroke="#a1a1aa" stroke-width="1">
      <circle cx="45" cy="45" r="7" />
      <circle cx="45" cy="45" r="3" fill="#d4d4d8" />
      <circle cx="210" cy="45" r="7" />
      <circle cx="210" cy="45" r="3" fill="#d4d4d8" />
      <circle cx="380" cy="55" r="7" />
      <circle cx="380" cy="55" r="3" fill="#d4d4d8" />
      <circle cx="385" cy="275" r="7" />
      <circle cx="385" cy="275" r="3" fill="#d4d4d8" />
      <circle cx="210" cy="280" r="7" />
      <circle cx="210" cy="280" r="3" fill="#d4d4d8" />
      <circle cx="35" cy="275" r="7" />
      <circle cx="35" cy="275" r="3" fill="#d4d4d8" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 2. HIGH-FLOW RED PLEATED AIR FILTER BEING INSERTED       -->
  <!-- ======================================================== -->
  <g id="airFilterElement" transform="translate(180, 115)">
    <!-- Red Polyurethane Sealing Frame -->
    <rect x="0" y="0" width="240" height="210" rx="16" fill="url(#rubberFrame)" stroke="#450a0a" stroke-width="2" />
    <!-- Inner Air Window -->
    <rect x="18" y="18" width="204" height="174" rx="8" fill="#09090b" stroke="#7f1d1d" stroke-width="1.5" />

    <!-- Accordion Pleated Filter Gauze (20 Pleats) -->
    <g transform="translate(24, 24)">
      <!-- Pleats repeated across width -->
      <path d="M 0,0 L 5,162 L 10,0 L 15,162 L 20,0 L 25,162 L 30,0 L 35,162 L 40,0 L 45,162 L 50,0 L 55,162 L 60,0 L 65,162 L 70,0 L 75,162 L 80,0 L 85,162 L 90,0 L 95,162 L 100,0 L 105,162 L 110,0 L 115,162 L 120,0 L 125,162 L 130,0 L 135,162 L 140,0 L 145,162 L 150,0 L 155,162 L 160,0 L 165,162 L 170,0 L 175,162 L 180,0 L 185,162 L 190,0" 
            fill="none" stroke="url(#pleatRed)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Epoxy Coated Wire Screen Reinforcement Lines -->
      <line x1="0" y1="40" x2="192" y2="40" stroke="url(#steelMesh)" stroke-width="1.2" opacity="0.6" stroke-dasharray="2 2" />
      <line x1="0" y1="80" x2="192" y2="80" stroke="url(#steelMesh)" stroke-width="1.2" opacity="0.6" stroke-dasharray="2 2" />
      <line x1="0" y1="120" x2="192" y2="120" stroke="url(#steelMesh)" stroke-width="1.2" opacity="0.6" stroke-dasharray="2 2" />
    </g>

    <!-- Clean Air Flow Direction Arrows -->
    <g fill="#10b981" opacity="0.8">
      <polygon points="120,70 128,82 124,82 124,96 116,96 116,82 112,82" />
      <polygon points="120,115 128,127 124,127 124,141 116,141 116,127 112,127" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 3. MOTORCYCLE CARTRIDGE OIL FILTER & RUBBER O-RING       -->
  <!-- ======================================================== -->
  <g id="oilFilterCartridge" transform="translate(560, 160)">
    <!-- Steel Spin-On Canister Base / Filter Body -->
    <rect x="0" y="20" width="110" height="130" rx="8" fill="#18181b" stroke="#52525b" stroke-width="1.8" />
    <rect x="10" y="30" width="90" height="110" rx="4" fill="url(#pleatRed)" opacity="0.9" />

    <!-- Perforated Center Tube Core -->
    <rect x="40" y="30" width="30" height="110" fill="#27272a" stroke="#71717a" stroke-width="1" />
    <g fill="#09090b">
      <circle cx="55" cy="45" r="3" />
      <circle cx="55" cy="65" r="3" />
      <circle cx="55" cy="85" r="3" />
      <circle cx="55" cy="105" r="3" />
      <circle cx="55" cy="125" r="3" />
    </g>

    <!-- Rubber Nitrile Sealing O-Ring Floating Above -->
    <ellipse cx="55" cy="10" rx="48" ry="12" fill="none" stroke="#18181b" stroke-width="5" />
    <ellipse cx="55" cy="10" rx="48" ry="12" fill="none" stroke="#3f3f46" stroke-width="3" />

    <!-- Spec Text -->
    <text x="55" y="175" fill="#a1a1aa" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">OIL FILTER CARTRIDGE</text>
  </g>

  <!-- Spec Badges in Corners -->
  <g transform="translate(30, 415)">
    <rect x="0" y="0" width="140" height="20" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
    <text x="70" y="14" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">WASHABLE HIGH-FLOW GAUZE</text>
  </g>

  <g transform="translate(630, 415)">
    <rect x="0" y="0" width="140" height="20" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
    <text x="70" y="14" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">99.2% PARTICLE TRAPPING</text>
  </g>
</svg>
