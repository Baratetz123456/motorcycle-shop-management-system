<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background -->
    <linearGradient id="oilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#09090b" />
      <stop offset="50%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#09090b" />
    </linearGradient>

    <!-- Grid -->
    <pattern id="oilGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#27272a" stroke-width="0.75" opacity="0.6" />
    </pattern>

    <!-- Golden Amber Synthetic Oil Stream -->
    <linearGradient id="goldenOil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="30%" stopColor="#facc15" />
      <stop offset="70%" stopColor="#eab308" />
      <stop offset="100%" stopColor="#ca8a04" />
    </linearGradient>

    <radialGradient id="oilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#facc15" stop-opacity="0.8" />
      <stop offset="60%" stopColor="#ca8a04" stop-opacity="0.3" />
      <stop offset="100%" stopColor="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Motul / Yamalube Red Oil Bottle -->
    <linearGradient id="bottleRed" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stopColor="#ef4444" />
      <stop offset="40%" stopColor="#dc2626" />
      <stop offset="85%" stopColor="#991b1b" />
      <stop offset="100%" stopColor="#7f1d1d" />
    </linearGradient>

    <!-- Cast Aluminum Motorcycle Crankcase Cover -->
    <linearGradient id="crankCaseAlu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3f3f46" />
      <stop offset="50%" stopColor="#27272a" />
      <stop offset="100%" stopColor="#18181b" />
    </linearGradient>

    <!-- Chrome Oil Funnel -->
    <linearGradient id="funnelChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#a1a1aa" />
      <stop offset="50%" stopColor="#f4f4f5" />
      <stop offset="100%" stopColor="#52525b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#oilBg)" />
  <rect width="800" height="450" fill="url(#oilGrid)" />

  <!-- Ambient Golden Glow -->
  <ellipse cx="400" cy="225" rx="350" ry="180" fill="#facc15" opacity="0.08" filter="blur(60px)" />
  <line x1="0" y1="449" x2="800" y2="449" stroke="#3f3f46" stroke-width="1" />

  <!-- Technical Spec Callout -->
  <g opacity="0.4" stroke="#71717a" stroke-width="0.8">
    <line x1="120" y1="40" x2="120" y2="410" stroke-dasharray="4 4" />
    <line x1="680" y1="40" x2="680" y2="410" stroke-dasharray="4 4" />
    <text x="30" y="38" fill="#a1a1aa" font-family="monospace" font-size="11" letter-spacing="1">4T SYNTHETIC MOTORCYCLE OIL SERVICE // CRANKCASE FLUSH &amp; LEVEL FILL SPEC</text>
  </g>

  <!-- ============================================== -->
  <!-- 1. MOTORCYCLE ENGINE CRANKCASE & CLUTCH COVER  -->
  <!-- ============================================== -->
  <g id="engineCrankcase" transform="translate(100, 150)">
    <!-- Main Right Engine Crankcase Outer Contour -->
    <path d="M 50 180 
             C 50 80, 120 40, 220 40 
             L 380 40 
             C 450 40, 500 90, 500 170 
             C 500 230, 440 260, 360 260 
             L 120 260 
             C 60 260, 50 220, 50 180 Z" 
          fill="url(#crankCaseAlu)" stroke="#52525b" stroke-width="2" />

    <!-- Circular Clutch Cover Casting Dome -->
    <circle cx="280" cy="150" r="85" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    <circle cx="280" cy="150" r="75" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- 8 Perimeter Clutch Cover Hex Bolts -->
    <g fill="#d4d4d8" stroke="#18181b" stroke-width="1">
      <circle cx="280" cy="72" r="4.5" />
      <circle cx="335" cy="95" r="4.5" />
      <circle cx="358" cy="150" r="4.5" />
      <circle cx="335" cy="205" r="4.5" />
      <circle cx="280" cy="228" r="4.5" />
      <circle cx="225" cy="205" r="4.5" />
      <circle cx="202" cy="150" r="4.5" />
      <circle cx="225" cy="95" r="4.5" />
    </g>

    <!-- Glass Oil Inspection Window (Sight Glass) -->
    <circle cx="390" cy="210" r="22" fill="#09090b" stroke="#a1a1aa" stroke-width="2" />
    <circle cx="390" cy="210" r="18" fill="url(#crankCaseAlu)" />
    <!-- Oil Level in Sight Glass (Golden Fluid meniscus with MAX/MIN lines) -->
    <path d="M 374 212 C 382 214, 398 214, 406 212 L 406 226 C 398 230, 382 230, 374 226 Z" fill="url(#goldenOil)" />
    <line x1="376" y1="202" x2="384" y2="202" stroke="#ef4444" stroke-width="1.5" />
    <line x1="376" y1="220" x2="384" y2="220" stroke="#ef4444" stroke-width="1.5" />

    <!-- Crankcase Oil Filler Neck & Threaded Port -->
    <g transform="translate(180, 20)">
      <rect x="-15" y="0" width="30" height="22" rx="3" fill="#3f3f46" stroke="#52525b" stroke-width="1.5" />
      <ellipse cx="0" cy="0" rx="15" ry="6" fill="#09090b" stroke="#71717a" stroke-width="1.5" />
    </g>
  </g>

  <!-- ============================================== -->
  <!-- 2. HIGH-PRECISION CHROME SERVICE FUNNEL        -->
  <!-- ============================================== -->
  <g id="chromeFunnel" transform="translate(280, 130)">
    <!-- Funnel Cone Body -->
    <polygon points="-35,-50 35,-50 10,40 -10,40" fill="url(#funnelChrome)" stroke="#71717a" stroke-width="1.5" />
    <!-- Funnel Spout into Engine -->
    <rect x="-9" y="40" width="18" height="25" fill="#52525b" stroke="#3f3f46" stroke-width="1.2" />
    <ellipse cx="0" cy="-50" rx="35" ry="9" fill="#27272a" stroke="#a1a1aa" stroke-width="1.5" />
  </g>

  <!-- ======================================================== -->
  <!-- 3. 4T SYNTHETIC OIL BOTTLE & GOLDEN OIL STREAM POURING  -->
  <!-- ======================================================== -->
  <g id="oilBottleAndPour" transform="translate(390, 30)">
    <!-- Tilted 4T Motorcycle Oil Bottle (45 deg angle) -->
    <g transform="rotate(-35 80 80)">
      <!-- Ergonomic Bottle Handle & Body -->
      <path d="M 20 50 
               L 80 20 
               C 100 10, 120 15, 130 35 
               L 160 170 
               C 165 190, 150 205, 130 205 
               L 30 205 
               C 10 205, -5 190, 0 170 
               L 10 70 
               C 12 55, 15 50, 20 50 Z" 
            fill="url(#bottleRed)" stroke="#450a0a" stroke-width="2" />

      <!-- Bottle Label (Motul 7100 / Yamalube 4T Style) -->
      <rect x="25" y="75" width="110" height="95" rx="4" fill="#09090b" stroke="#3f3f46" stroke-width="1" />
      <text x="80" y="100" fill="#facc15" font-family="sans-serif" font-weight="900" font-size="14" letter-spacing="1" text-anchor="middle">4T MOTO</text>
      <text x="80" y="118" fill="#f4f4f5" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">100% SYNTHETIC</text>
      <text x="80" y="136" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">10W-40 JASO MA2</text>
      <rect x="40" y="146" width="80" height="14" rx="2" fill="#dc2626" />
      <text x="80" y="156" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">1.0 LITER</text>

      <!-- Bottle Neck & Dispenser Spout -->
      <path d="M 75 20 L 85 -10 L 105 -10 L 95 20 Z" fill="#d4d4d8" stroke="#18181b" stroke-width="1.2" />
      <ellipse cx="95" cy="-10" rx="10" ry="4" fill="#18181b" stroke="#71717a" stroke-width="1" />
    </g>

    <!-- Translucent Golden Amber Oil Stream Arcing Down into Funnel -->
    <!-- Glow behind stream -->
    <path d="M 25 10 C -20 30, -80 60, -110 90" fill="none" stroke="url(#goldenOil)" stroke-width="14" opacity="0.4" stroke-linecap="round" filter="blur(4px)" />
    <!-- Core Golden Oil Stream -->
    <path d="M 25 10 C -20 30, -80 60, -110 90" fill="none" stroke="url(#goldenOil)" stroke-width="8" stroke-linecap="round" />
    <path d="M 22 10 C -22 30, -82 60, -110 90" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" />

    <!-- Droplets splashing at mouth -->
    <circle cx="-112" cy="85" r="3.5" fill="#facc15" />
    <circle cx="-105" cy="78" r="2" fill="#fef08a" />
    <circle cx="-118" cy="92" r="2.5" fill="#eab308" />
  </g>

  <!-- Spec Badges in Corners -->
  <g transform="translate(30, 415)">
    <rect x="0" y="0" width="140" height="20" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
    <text x="70" y="14" fill="#facc15" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">JASO MA2 / API SN SPEC</text>
  </g>

  <g transform="translate(630, 415)">
    <rect x="0" y="0" width="140" height="20" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
    <text x="70" y="14" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">100% CRANKCASE FLUSH</text>
  </g>
</svg>
