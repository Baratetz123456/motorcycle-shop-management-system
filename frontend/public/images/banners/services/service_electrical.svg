<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background -->
    <linearGradient id="elecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#09090b" />
      <stop offset="50%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#09090b" />
    </linearGradient>

    <!-- Technical Grid -->
    <pattern id="elecGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#27272a" stroke-width="0.75" opacity="0.6" />
    </pattern>

    <!-- Copper Stator Windings -->
    <linearGradient id="copperWire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fb923c" />
      <stop offset="40%" stopColor="#ea580c" />
      <stop offset="80%" stopColor="#c2410c" />
      <stop offset="100%" stopColor="#7c2d12" />
    </linearGradient>

    <!-- Multimeter Yellow Body -->
    <linearGradient id="meterYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fde047" />
      <stop offset="40%" stopColor="#eab308" />
      <stop offset="100%" stopColor="#ca8a04" />
    </linearGradient>

    <!-- Wiring Harness Wire Colors -->
    <linearGradient id="wireRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ef4444" />
      <stop offset="100%" stopColor="#991b1b" />
    </linearGradient>
    <linearGradient id="wireBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0369a1" />
    </linearGradient>
    <linearGradient id="wireGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#4ade80" />
      <stop offset="100%" stopColor="#15803d" />
    </linearGradient>
    <linearGradient id="wireYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#facc15" />
      <stop offset="100%" stopColor="#a16207" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#elecBg)" />
  <rect width="800" height="450" fill="url(#elecGrid)" />

  <!-- Ambient Cyan Electrical Glow -->
  <ellipse cx="400" cy="225" rx="350" ry="180" fill="#06b6d4" opacity="0.08" filter="blur(60px)" />
  <line x1="0" y1="449" x2="800" y2="449" stroke="#3f3f46" stroke-width="1" />

  <!-- Technical Spec Callout -->
  <g opacity="0.4" stroke="#71717a" stroke-width="0.8">
    <line x1="120" y1="40" x2="120" y2="410" stroke-dasharray="4 4" />
    <line x1="680" y1="40" x2="680" y2="410" stroke-dasharray="4 4" />
    <text x="30" y="38" fill="#a1a1aa" font-family="monospace" font-size="11" letter-spacing="1">MOTORCYCLE 12V DC ELECTRICAL HARNESS // STATOR MAGNETO &amp; MULTIMETER DIAGNOSTICS</text>
  </g>

  <!-- ============================================== -->
  <!-- 1. MOTORCYCLE STATOR MAGNETO COIL (COPPER)     -->
  <!-- ============================================== -->
  <g id="statorCoil" transform="translate(180, 225)">
    <!-- Center Mounting Hub & Steel Laminations -->
    <circle cx="0" cy="0" r="85" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    <circle cx="0" cy="0" r="45" fill="#09090b" stroke="#52525b" stroke-width="1.5" />
    <!-- 3 Stator Bolt Mounting Holes -->
    <circle cx="0" cy="-25" r="5" fill="#27272a" stroke="#a1a1aa" stroke-width="1" />
    <circle cx="-22" cy="15" r="5" fill="#27272a" stroke="#a1a1aa" stroke-width="1" />
    <circle cx="22" cy="15" r="5" fill="#27272a" stroke="#a1a1aa" stroke-width="1" />

    <!-- 12 Radial Copper Stator Pole Windings -->
    <g stroke="#7c2d12" stroke-width="1">
      <!-- 12 poles arranged in 30 deg steps -->
      <g transform="rotate(0)"><rect x="-12" y="-95" width="24" height="28" rx="4" fill="url(#copperWire)" /></g>
      <g transform="rotate(30)"><rect x="-12" y="-95" width="24" height="28" rx="4" fill="url(#copperWire)" /></g>
      <g transform="rotate(60)"><rect x="-12" y="-95" width="24" height="28" rx="4" fill="url(#copperWire)" /></g>
      <g transform="rotate(90)"><rect x="-12" y="-95" width="24" height="28" rx="4" fill="url(#copperWire)" /></g>
      <g transform="rotate(120)"><rect x="-12" y="-95" width="24" height="28" rx="4" fill="url(#copperWire)" /></g>
      <g transform="rotate(150)"><rect x="-12" y="-95" width="24" height="28" rx="4" fill="url(#copperWire)" /></g>
      <g transform="rotate(180)"><rect x="-12" y="-95" width="24" height="28" rx="4" fill="url(#copperWire)" /></g>
      <g transform="rotate(210)"><rect x="-12" y="-95" width="24" height="28" rx="4" fill="url(#copperWire)" /></g>
      <g transform="rotate(240)"><rect x="-12" y="-95" width="24" height="28" rx="4" fill="url(#copperWire)" /></g>
      <g transform="rotate(270)"><rect x="-12" y="-95" width="24" height="28" rx="4" fill="url(#copperWire)" /></g>
      <g transform="rotate(300)"><rect x="-12" y="-95" width="24" height="28" rx="4" fill="url(#copperWire)" /></g>
      <g transform="rotate(330)"><rect x="-12" y="-95" width="24" height="28" rx="4" fill="url(#copperWire)" /></g>
    </g>

    <!-- Pickup Pulsar Coil Sensor -->
    <g transform="translate(75, -80)">
      <rect x="0" y="0" width="28" height="24" rx="3" fill="#18181b" stroke="#71717a" stroke-width="1.2" />
      <circle cx="14" cy="12" r="4" fill="#38bdf8" />
    </g>
  </g>

  <!-- ============================================== -->
  <!-- 2. MOTORCYCLE MAIN WIRING HARNESS & CONNECTORS -->
  <!-- ============================================== -->
  <g id="wiringHarness" transform="translate(260, 110)">
    <!-- Main Black Loom Conduit -->
    <path d="M -80 40 C -30 20, 20 10, 80 15 C 130 20, 160 40, 210 50" fill="none" stroke="#18181b" stroke-width="18" stroke-linecap="round" />
    <path d="M -80 40 C -30 20, 20 10, 80 15 C 130 20, 160 40, 210 50" fill="none" stroke="#27272a" stroke-width="14" stroke-dasharray="8 4" stroke-linecap="round" />

    <!-- Individual Colored Wires Branching Out -->
    <!-- Red 12V Battery Positive -->
    <path d="M 80 15 C 110 -10, 150 -15, 190 -10 L 250 10" fill="none" stroke="url(#wireRed)" stroke-width="4" stroke-linecap="round" />
    <!-- Blue Stator Charge -->
    <path d="M 90 18 C 120 10, 160 15, 190 30 L 250 45" fill="none" stroke="url(#wireBlue)" stroke-width="4" stroke-linecap="round" />
    <!-- Green Ground -->
    <path d="M 100 20 C 130 30, 170 45, 200 65 L 250 80" fill="none" stroke="url(#wireGreen)" stroke-width="4" stroke-linecap="round" />
    <!-- Yellow Lighting / CDI -->
    <path d="M 110 22 C 140 50, 180 80, 200 105 L 250 115" fill="none" stroke="url(#wireYellow)" stroke-width="4" stroke-linecap="round" />

    <!-- Multi-Pin Waterproof Motorcycle Wiring Plugs (Molex Plugs) -->
    <!-- Plug 1 -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="35" height="22" rx="3" fill="#f4f4f5" stroke="#71717a" stroke-width="1.2" />
      <rect x="35" y="4" width="6" height="14" rx="2" fill="#e4e4e7" />
      <!-- Terminals inside -->
      <circle cx="10" cy="11" r="3" fill="#ca8a04" />
      <circle cx="20" cy="11" r="3" fill="#ca8a04" />
    </g>

    <!-- Plug 2 (ECU / CDI 6-Pin Multi-Connector) -->
    <g transform="translate(250, 50)">
      <rect x="0" y="0" width="45" height="35" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
      <rect x="45" y="8" width="8" height="18" rx="2" fill="#27272a" />
      <g fill="#facc15">
        <circle cx="12" cy="12" r="2.5" />
        <circle cx="22" cy="12" r="2.5" />
        <circle cx="32" cy="12" r="2.5" />
        <circle cx="12" cy="24" r="2.5" />
        <circle cx="22" cy="24" r="2.5" />
        <circle cx="32" cy="24" r="2.5" />
      </g>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- 3. DIGITAL AUTOMOTIVE / MOTORCYCLE MULTIMETER  -->
  <!-- ============================================== -->
  <g id="digitalMultimeter" transform="translate(560, 100)">
    <!-- Yellow Rugged Protective Holster Case -->
    <rect x="0" y="0" width="130" height="220" rx="16" fill="url(#meterYellow)" stroke="#78350f" stroke-width="2" />
    <!-- Dark Inner Panel -->
    <rect x="10" y="10" width="110" height="200" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />

    <!-- Backlit LCD Digital Display -->
    <rect x="18" y="20" width="94" height="48" rx="4" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
    <text x="65" y="52" fill="#2dd4bf" font-family="monospace" font-size="22" font-weight="900" letter-spacing="1" text-anchor="middle">14.42</text>
    <text x="102" y="32" fill="#2dd4bf" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="end">V DC</text>

    <!-- Rotary Range Selector Dial -->
    <circle cx="65" cy="115" r="32" fill="#27272a" stroke="#52525b" stroke-width="1.5" />
    <circle cx="65" cy="115" r="24" fill="#09090b" stroke="#71717a" stroke-width="1" />
    <!-- Dial Pointer pointing to DC Volts -->
    <rect x="63" y="90" width="4" height="25" rx="2" fill="#facc15" />

    <!-- 3 Banana Input Jacks -->
    <circle cx="35" cy="180" r="7" fill="#dc2626" stroke="#18181b" stroke-width="1.2" />
    <circle cx="65" cy="180" r="7" fill="#18181b" stroke="#52525b" stroke-width="1.2" />
    <circle cx="95" cy="180" r="7" fill="#eab308" stroke="#18181b" stroke-width="1.2" />

    <!-- Red & Black Test Probe Leads Arcing Out -->
    <path d="M 35 180 C 15 220, -50 210, -100 170" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />
    <path d="M 65 180 C 45 235, -20 240, -80 215" fill="none" stroke="#27272a" stroke-width="4" stroke-linecap="round" />

    <!-- Probe Needle Probing Wire Terminal -->
    <g transform="translate(-100, 170)">
      <rect x="-15" y="-4" width="20" height="8" rx="2" fill="#dc2626" />
      <line x1="5" y1="0" x2="25" y2="0" stroke="#f4f4f5" stroke-width="2" />
      <!-- Electrical Spark Effect -->
      <circle cx="25" cy="0" r="3" fill="#38bdf8" />
    </g>
  </g>

  <!-- Spec Badges in Corners -->
  <g transform="translate(30, 415)">
    <rect x="0" y="0" width="145" height="20" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
    <text x="72" y="14" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">12V DC CHARGING SYSTEM</text>
  </g>

  <g transform="translate(630, 415)">
    <rect x="0" y="0" width="140" height="20" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
    <text x="70" y="14" fill="#facc15" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">STATOR &amp; CDI DIAGNOSTIC</text>
  </g>
</svg>
