# =============================================================================
# CD Pipeline — Zero-Cost Serverless Deployment (AWS SAM + Amplify)
# =============================================================================
# Triggered on push to main branch.
# 1. Runs full CI test suite (Frontend checks, pytest, container scan)
# 2. Builds Lambda container images and deploys backend via AWS SAM
# Note: Next.js frontend is auto-deployed by AWS Amplify Hosting on Git push
# =============================================================================

name: Deploy Serverless Backend

on:
  push:
    branches: [main]

concurrency:
  group: deploy-serverless
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  STACK_NAME: motoshop-serverless

jobs:
  # ===========================================================================
  # Job 1: Run CI checks
  # ===========================================================================
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  # ===========================================================================
  # Job 2: Build & Deploy Backend via AWS SAM
  # ===========================================================================
  deploy-backend:
    name: Deploy Backend (AWS SAM)
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build SAM application
        run: sam build

      - name: Deploy to AWS Lambda & API Gateway
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --resolve-image-repos \
            --parameter-overrides \
                DatabaseUrl="${{ secrets.DATABASE_URL }}" \
                RedisUrl="${{ secrets.REDIS_URL }}" \
                JwtSecretKey="${{ secrets.JWT_SECRET_KEY }}"

      - name: Deployment Summary
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" \
            --output text)
          
          echo "## 🚀 Serverless Backend Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Stack:** \`${{ env.STACK_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**HTTP API Gateway:** $API_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Frontend is continuously synced and hosted via **AWS Amplify Hosting**." >> $GITHUB_STEP_SUMMARY
