# =============================================================================
# CD Pipeline — MotoShop Zero-Cost Serverless Deployment (AWS SAM + CloudFront + S3)
# =============================================================================
# Triggered on push to main branch.
# 1. Runs full CI test suite (Frontend checks, pytest)
# 2. Builds Lambda container images and deploys backend via AWS SAM
# 3. Invokes VPC Migration Lambda to apply schema updates
# 4. Builds static Next.js SPA and syncs to S3 bucket
# 5. Invalidates CloudFront edge distribution cache
# =============================================================================

name: Deploy Zero-Cost Serverless Stack

on:
  push:
    branches: [main]

concurrency:
  group: deploy-serverless
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  STACK_NAME: motoshop-serverless

jobs:
  # ===========================================================================
  # Job 1: Run CI checks
  # ===========================================================================
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  # ===========================================================================
  # Job 2: Build & Deploy Backend via AWS SAM
  # ===========================================================================
  deploy-backend:
    name: Deploy Backend & Run Migrations (AWS SAM)
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build SAM application
        run: sam build

      - name: Deploy to AWS Lambda & API Gateway
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --resolve-image-repos \
            --parameter-overrides \
                DatabaseUrl="${{ secrets.DATABASE_URL }}" \
                JwtSecretKey="${{ secrets.JWT_SECRET_KEY }}"

      - name: Invoke VPC Migration Lambda
        run: |
          aws lambda invoke \
            --function-name $(aws cloudformation describe-stacks \
              --stack-name ${{ env.STACK_NAME }} \
              --region ${{ env.AWS_REGION }} \
              --query "Stacks[0].Outputs[?OutputKey=='MigrationFunctionName'].OutputValue" \
              --output text) \
            --payload '{}' \
            migration_result.json || true
          if [ -f migration_result.json ]; then
            cat migration_result.json
          fi

  # ===========================================================================
  # Job 3: Build & Deploy Static Frontend to S3 and CloudFront
  # ===========================================================================
  deploy-frontend:
    name: Deploy Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Infrastructure Outputs
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)
          CF_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          CF_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" \
            --output text)

          echo "FRONTEND_BUCKET=$BUCKET" >> $GITHUB_ENV
          echo "CLOUDFRONT_ID=$CF_ID" >> $GITHUB_ENV
          echo "CLOUDFRONT_URL=$CF_URL" >> $GITHUB_ENV

      - name: Install dependencies & Build Next.js Static SPA
        run: |
          cd frontend
          npm ci
          NEXT_PUBLIC_API_URL="/api/v1" npm run build

      - name: Sync Static Assets to Amazon S3
        run: |
          aws s3 sync frontend/out s3://${{ env.FRONTEND_BUCKET }} --delete

      - name: Invalidate CloudFront Distribution Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_ID }} \
            --paths "/*"

      - name: Deployment Summary
        run: |
          echo "## 🚀 Zero-Cost Serverless Stack Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Stack:** \`${{ env.STACK_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Public CloudFront URL:** ${{ env.CLOUDFRONT_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Bucket:** \`${{ env.FRONTEND_BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Backend and Frontend are operating under a unified same-origin zero-cost architecture." >> $GITHUB_STEP_SUMMARY
