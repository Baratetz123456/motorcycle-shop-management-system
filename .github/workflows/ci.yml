# =============================================================================
# CI Pipeline — Runs on every PR and Push to develop and main
# =============================================================================
# Jobs:
#   1. frontend-checks:         ESLint, TypeScript, Next.js build, strict npm audit
#   2. backend-tests:           pytest (43 tests) with Python 3.12 & PostgreSQL 16
#   3. security-scans:          Gitleaks secret scan, Bandit SAST, pip-audit
#   4. docker-build-and-trivy:  Build active Docker images & Trivy HIGH/CRITICAL scan
# =============================================================================

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: Frontend Checks
  # ===========================================================================
  frontend-checks:
    name: Frontend — Lint, Type-check, Build, Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint .

      - name: Run TypeScript type-check
        run: npx tsc --noEmit

      - name: Build Next.js (standalone)
        run: npm run build

      - name: Run npm audit (Strict Zero-Tolerance Gate)
        run: npm audit --audit-level=high

  # ===========================================================================
  # Job 2: Backend Tests
  # ===========================================================================
  backend-tests:
    name: Backend — pytest (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123"
          POSTGRES_DB: motorcycle_shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize DB Schemas & Operational Seed Data
        run: |
          PGPASSWORD=123 psql -h localhost -U postgres -d motorcycle_shop -f init.sql
          PGPASSWORD=123 psql -h localhost -U postgres -d motorcycle_shop -f backend/seed_operational_data.sql

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Backend Test Suite (43 tests)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:123@localhost:5432/motorcycle_shop
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline
          COOKIE_SECURE: "false"
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/ -v --tb=short

  # ===========================================================================
  # Job 3: Security Scanning (SAST, Secrets, Dependency Audits)
  # ===========================================================================
  security-scans:
    name: Security — Gitleaks, Bandit SAST, pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan — Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SAST & Audit Tools
        run: pip install bandit pip-audit

      - name: Python SAST — Bandit (Medium & High Severity)
        run: bandit -r backend/app/ -ll

      - name: Python Dependency Audit — pip-audit
        run: pip-audit -r backend/requirements.txt

  # ===========================================================================
  # Job 4: Docker Build & Container Vulnerability Scan
  # ===========================================================================
  docker-build-and-trivy:
    name: Docker — Build & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-tests, security-scans]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: motoshop-frontend:ci

      - name: Build Backend image (Modular Monolith)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: motoshop-backend:ci

      - name: Scan Frontend image with Trivy (Strict Zero-Tolerance Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: motoshop-frontend:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Scan Backend image with Trivy (Strict Zero-Tolerance Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: motoshop-backend:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
