# =============================================================================
# CI Pipeline — Runs on every Pull Request to develop and main
# =============================================================================
# Jobs:
#   1. frontend-checks: ESLint, TypeScript type-check, Next.js build, npm audit
#   2. backend-tests:   pytest with Python 3.11
#   3. docker-build:    Verify all 5 Docker images build successfully
#   4. security-scan:   Trivy vulnerability scan on all images
# =============================================================================

name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: Frontend Checks
  # ===========================================================================
  frontend-checks:
    name: Frontend — Lint, Type-check, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint .

      - name: Run TypeScript type-check
        run: npx tsc --noEmit

      - name: Build Next.js (standalone)
        run: npm run build

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Advisory — don't block PRs on audit warnings

  # ===========================================================================
  # Job 2: Backend Tests
  # ===========================================================================
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ===========================================================================
  # Job 3: Docker Build Verification
  # ===========================================================================
  docker-build:
    name: Docker — Build All Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: motoshop-frontend:ci

      - name: Build Auth Service image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/auth_service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: motoshop-auth:ci

      - name: Build Inventory Service image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/inventory_service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: motoshop-inventory:ci

      - name: Build Sales Service image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/sales_service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: motoshop-sales:ci

      - name: Build Repairs Service image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/repairs_service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: motoshop-repairs:ci

  # ===========================================================================
  # Job 4: Security Scanning
  # ===========================================================================
  security-scan:
    name: Security — Trivy Image Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: motoshop-frontend:scan

      - name: Build Auth Service image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/auth_service/Dockerfile
          push: false
          load: true
          tags: motoshop-auth:scan

      - name: Build Inventory Service image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/inventory_service/Dockerfile
          push: false
          load: true
          tags: motoshop-inventory:scan

      - name: Build Sales Service image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/sales_service/Dockerfile
          push: false
          load: true
          tags: motoshop-sales:scan

      - name: Build Repairs Service image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/repairs_service/Dockerfile
          push: false
          load: true
          tags: motoshop-repairs:scan

      - name: Scan Frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: motoshop-frontend:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Scan Auth Service image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: motoshop-auth:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Scan Inventory Service image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: motoshop-inventory:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Scan Sales Service image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: motoshop-sales:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Scan Repairs Service image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: motoshop-repairs:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
